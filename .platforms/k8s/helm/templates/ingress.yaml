apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.back.name }}
  annotations:
    cert-manager.io/cluster-issuer: "ca-issuer"
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-{{ .Values.back.name }}-strip-apims@kubernetescrd"
spec:
  tls:
    - hosts:
        - {{ .Values.back.ingress.interne.host }}
      secretName: tls-{{ .Values.back.name }}-cert
  rules:
    - host: "{{ .Values.back.ingress.interne.host }}"
      http:
        paths:
          - path: /apims
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.back.name }}"
                port:
                  number: {{ .Values.back.service.port }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.back.name }}-strip-apims
spec:
  stripPrefix:
    prefixes:
      - /apims
