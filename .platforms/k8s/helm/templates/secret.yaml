apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.back.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{.Values.back.name}}
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: {{ .Values.back.secret.path }}
      metadataPolicy: None
      property: dbpassword
---
# Secret du compte de service Keycloak minds-rgpd-admin (client_credentials),
# isolé du secret de base de données : une propriété Vault Keycloak manquante
# ne bloque pas la synchronisation de DB_PASSWORD.
# La propriété `keycloak_admin_client_secret` doit exister dans Vault au chemin
# `back.secret.path` (une par environnement : saas_rgpd/{int,valid,demo}/k8s,
# minds-rgpd/k8s/config…).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.back.name }}-keycloak
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{.Values.back.name}}-keycloak
  data:
  - secretKey: KEYCLOAK_ADMIN_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: {{ .Values.back.secret.path }}
      metadataPolicy: None
      property: keycloak_admin_client_secret

