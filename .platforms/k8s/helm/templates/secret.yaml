apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.back.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{.Values.back.name}}
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: {{ .Values.back.secret.path }}
      metadataPolicy: None
      property: dbpassword
  # Secret du compte de service Keycloak minds-rgpd-admin (client_credentials).
  # La propriété `keycloak_admin_client_secret` doit exister dans Vault à ce
  # chemin (une par environnement : saas_rgpd/{int,valid,demo}/k8s, minds-rgpd/k8s/config…).
  - secretKey: KEYCLOAK_ADMIN_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: {{ .Values.back.secret.path }}
      metadataPolicy: None
      property: keycloak_admin_client_secret

