variables:
  PROJECT_NAME: "minds-saas-rgpd-api"

include:
  - component: $CI_SERVER_FQDN/commun/components/framework/spring-boot@72be0466d1fa5ac83e46e58a606bc610ca099251
    inputs:
      app_name: "$PROJECT_NAME"
      image_name: "projets/minds-rgpd/$PROJECT_NAME"
      host_suffix: "host-suffix-rgpd"
      version: $CALCULATED_VERSION
      namespace: $TARGET_NAMESPACE

stages:
  - build
  - unit-tests
  - trivy
  - sonar
  - publish
  - deploy
  - doc
  - release


build:
  stage: build
  image: srv-nexus.domaine.local:18444/outillage/maven:3.9.5-jdk21-dind
  before_script:
    - CALCULATED_VERSION="0.0.1-SNAPSHOT"
  artifacts:
    reports:
      dotenv: variables.env

unit-tests:
  stage: test
  script:
    - echo "Unit tests"

trivy:
  stage: quality
  script:
    - echo "Trivy"

publish:
  stage: publish
  script:
    - echo "Publish"

deploy:
  stage: deploy
  script:
    - echo "Deploy"    

doc:
  stage: doc
  script:
    - echo "Documentation"

release:
  stage: doc
  script:
    - echo "Documentation"    

sonar_job:
  stage: sonar
  script:
    - echo "Sonar"    