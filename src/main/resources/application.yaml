application:
  version: @project.version@
  fichier.upload.dir: ${UPLOAD_DIR}
  keycloak:
    enabled: ${KEYCLOAK_SYNC_ENABLED:true}
    base-url: ${KEYCLOAK_BASE_URL:https://sso.minds.k8s/auth}
    realm: ${KEYCLOAK_REALM:minds-rgpd}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:minds-saas-rgpd-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    resource-client-id: ${KEYCLOAK_RESOURCE_CLIENT_ID:minds-saas-rgpd}
    taille-page: 100
    nombre-max-resultats: 2000
    desactiver-verification-ssl: ${KEYCLOAK_DESACTIVER_VERIFICATION_SSL:false}

# Configuration Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0

spring:
  jpa:
    open-in-view: false
  application:
    name: minds-rgpd-api
    description: @project.description@
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driverClassName: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: 'true'
    user: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  main:
    allow-bean-definition-overriding: 'true'
  mvc:
    patchmatch:
      matching-strategy: ant_path_matcher
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}

otel:
  sdk:
    disabled: true

server:
  forward-header-strategy: NATIVE
  port: 8080


# Enhanced JWT and OpenTelemetry debugging
logging:
  level:
    root: info
    # OpenTelemetry debugging
    # io.opentelemetry: TRACE
    # io.opentelemetry.api: DEBUG
    # io.opentelemetry.exporter.otlp: TRACE
    # io.opentelemetry.instrumentation: TRACE
    # io.opentelemetry.sdk: TRACE
    # io.opentelemetry.sdk.trace: TRACE
    # io.opentelemetry.instrumentation.spring.webmvc: TRACE

# Configuration SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
