spring:
  jpa:
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5434/docker
    username: docker
    password: docker
  flyway:
    user: docker
    password: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sso.minds.k8s/auth/realms/minds-rgpd
          jwk-set-uri: https://sso.minds.k8s/auth/realms/minds-rgpd/protocol/openid-connect/certs
application:
  allowed-origins: "http://localhost:4200"
  fichier.upload.dir: "."

management:
  tracing:
    enabled: false

otel:
  sdk:
    disabled: true

# Configuration Keycloak pour le développement (sync vers le Keycloak distant)
keycloak:
  enabled: true
  base-url: https://sso.minds.k8s/auth
  realm: minds-rgpd
  admin-client-id: minds-rgpd-admin
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  resource-client-id: minds-saas-rgpd
  group-prefix: /clients
  page-size: 200
  token-expiration-marge: 300000

# Optional: For debugging
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG