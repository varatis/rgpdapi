# TestContainers configuration - database connection is automatically configured
# through @ServiceConnection annotation in TestContainersConfiguration
# No need to specify datasource URL, username, or password

spring:
  # Database configuration is handled by TestContainers @ServiceConnection
  # No need to specify datasource URL, username, or password

  # Flyway will use the same TestContainers database automatically
  flyway:
    enabled: true

application:
  fichier:
    upload:
      dir: "src/test/resources/rgpdFile"
  allowed-origins: "*"

management:
  tracing:
    enabled: false

otel:
  sdk:
    disabled: true

# Keycloak disabled for tests - use no-op gateway
keycloak:
  enabled: false
  base-url: https://sso.minds.k8s/auth
  realm: minds-rgpd
  admin-client-id: minds-rgpd-admin
  admin-client-secret: test-secret
  resource-client-id: minds-saas-rgpd
  group-prefix: /clients
  page-size: 200
  token-expiration-marge: 300000

# Enable TestContainers logging for debugging (optional)
logging:
  level:
    org.testcontainers: INFO
    com.minds.rgpd: DEBUG