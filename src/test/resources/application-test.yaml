# TestContainers configuration - database connection is automatically configured
# through @ServiceConnection annotation in TestContainersConfiguration

spring:
  # Database configuration is handled by TestContainers @ServiceConnection
  # No need to specify datasource URL, username, or password
  
  # Flyway will use the same TestContainers database automatically
  flyway:
    # User and password will be set automatically by TestContainers
    enabled: true
    
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://sso.minds.k8s/auth/realms/minds-rgpd
          jwk-set-uri: http://sso.minds.k8s/auth/realms/minds-rgpd/protocol/openid-connect/certs
          
application:
  fichier:
    upload:
      dir: "src/test/resources/rgpdFile"
  allowed-origins: "*"
  keycloak:
    enabled: false
    base-url: http://localhost:8443
    realm: minds-rgpd
    admin-client-id: minds-saas-rgpd-admin
    admin-client-secret: secret_test
    resource-client-id: minds-saas-rgpd

management:
  tracing:
    enabled: false

otel:
  sdk:
    disabled: true
# Enable TestContainers logging for debugging (optional)
logging:
  level:
    org.testcontainers: INFO
    com.minds.rgpd: DEBUG